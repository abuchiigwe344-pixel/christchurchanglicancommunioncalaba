[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/site-data"
  to = "/.netlify/functions/site-data"
  status = 200

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/api/church-image"
  to = "/.netlify/functions/church-image"
  status = 200
